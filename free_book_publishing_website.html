<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Free Book Publishing Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {font-family: Arial, sans-serif; margin:0; background:#f5f7fa; color:#333;}
    header {background:#4f46e5; color:white; padding:20px; text-align:center;}
    section {padding:20px; max-width:1000px; margin:auto;}
    .card {background:white; padding:20px; border-radius:10px; margin-bottom:20px; box-shadow:0 4px 10px rgba(0,0,0,0.1);}    
    h2 {color:#4f46e5;}
    input, textarea {width:100%; padding:10px; margin:8px 0; border-radius:6px; border:1px solid #ccc;}
    button {background:#4f46e5; color:white; border:none; padding:10px 18px; border-radius:8px; cursor:pointer;}
    button:hover {background:#4338ca;}
    .story {border-bottom:1px solid #e5e7eb; padding:10px 0;}
    .author {font-size:14px; color:#555;}
    footer {background:#111827; color:#9ca3af; text-align:center; padding:15px;}
  </style>
</head>
<body>

<header>
  <h1>📚 Free Book Publishing</h1>
  <p>Publish your story online — 100% Free</p>
</header>

<section>
  <div class="card">
    <h2>✍️ Submit Your Story</h2>
    <form id="storyForm">
      <input type="text" id="author" placeholder="Author Name" required />
      <input type="text" id="title" placeholder="Story Title" required />
      <textarea id="content" rows="6" placeholder="Write your story here..." required></textarea>
      <button type="submit">Publish</button>
    </form>
  </div>

  <div class="card">
    <h2>📖 Published Stories</h2>
    <div id="stories"></div>
  </div>
</section>

<footer>
  <p>© 2026 Free Book Publishing | For Young Writers</p>
</footer>

<script>
  const form = document.getElementById('storyForm');
  const storiesDiv = document.getElementById('stories');

  let stories = JSON.parse(localStorage.getItem('stories')) || [];

  function renderStories() {
    storiesDiv.innerHTML = '';
    stories.forEach((s, i) => {
      storiesDiv.innerHTML += `
        <div class="story">
          <h3>${s.title}</h3>
          <p class="author">✍️ ${s.author}</p>
          <p>${s.content}</p>
        </div>`;
    });
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const story = {
      author: author.value,
      title: title.value,
      content: content.value
    };
    stories.unshift(story);
    localStorage.setItem('stories', JSON.stringify(stories));
    form.reset();
    renderStories();
  });

  renderStories();
</script>

</body>
</html>
